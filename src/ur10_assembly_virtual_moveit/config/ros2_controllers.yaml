controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - ur10_shoulder_pan
      - ur10_shoulder_lift
      - ur10_elbow
      - ur10_wrist_1
      - ur10_wrist_2
      - ur10_wrist_3
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      ur10_shoulder_pan: {trajectory: 0.2, goal: 0.1}
      ur10_shoulder_lift: {trajectory: 0.2, goal: 0.1}
      ur10_elbow: {trajectory: 0.2, goal: 0.1}
      ur10_wrist_1: {trajectory: 0.2, goal: 0.1}
      ur10_wrist_2: {trajectory: 0.2, goal: 0.1}
      ur10_wrist_3: {trajectory: 0.2, goal: 0.1}
